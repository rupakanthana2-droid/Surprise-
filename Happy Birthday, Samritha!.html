<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Samritha!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1033;--bg2:#2b1650;--ink:#fff4e6;--mute:#c9b8e8;--gold:#ffb627;--pink:#ff4f93;--teal:#2de2c5;--card:#2f1a58;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-behavior:smooth;height:auto}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,var(--bg2),var(--bg));background-color:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.5;overflow-x:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
section{max-width:860px;margin:0 auto;padding:56px 20px;text-align:center}
h1{font-size:clamp(2.6rem,10vw,6rem);line-height:.98;margin:0;font-weight:800;letter-spacing:-.03em}
h1 .l{display:inline-block;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.8,.5,1),color .2s}
h1 .l:hover,h1 .l.hop{transform:translateY(-14px) rotate(-6deg);color:var(--gold)}
h1 .name{display:block;color:var(--pink)}
h2{font-size:clamp(1.5rem,5vw,2.2rem);margin:0 0 6px;font-weight:700;letter-spacing:-.02em}
p.sub{color:var(--mute);margin:0 0 28px}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.cta{background:var(--gold);color:#2a1300;font-weight:700;padding:14px 26px;border-radius:999px;box-shadow:0 6px 0 #b57a00;transition:transform .12s,box-shadow .12s}
.cta:active{transform:translateY(5px);box-shadow:0 1px 0 #b57a00}
.cta.alt{background:var(--pink);color:#fff;box-shadow:0 6px 0 #a3235b}
.cta.alt:active{box-shadow:0 1px 0 #a3235b}
#cake{width:min(340px,86vw);margin:22px auto 8px;display:block;overflow:visible}
.cndl{cursor:pointer}
.flame{opacity:0;transform-origin:center bottom;transition:opacity .25s;animation:fl .5s infinite alternate}
.cndl.on .flame{opacity:1}
@keyframes fl{to{transform:scale(1.15,.9) rotate(4deg)}}
#status{min-height:3.2em;color:var(--mute);margin:6px 0 14px}
.row{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.gift{width:170px;background:var(--card);border-radius:20px;padding:18px 14px;text-align:center;transition:transform .2s}
.gift:hover{transform:translateY(-4px)}
.gift .ic{font-size:3.2rem;display:block;transition:transform .4s}
.gift[aria-expanded=true] .ic{transform:scale(1.3) rotate(12deg)}
.gift .msg{display:block;max-height:0;overflow:hidden;opacity:0;transition:max-height .4s,opacity .4s,margin .4s;color:var(--gold);font-weight:600}
.gift[aria-expanded=true] .msg{max-height:200px;opacity:1;margin-top:10px}
.flip{width:200px;height:150px;perspective:700px;background:none;padding:0}
.flip span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;border-radius:20px;backface-visibility:hidden;transition:transform .55s;font-weight:600}
.flip{position:relative}
.flip .f{background:var(--pink);font-size:1.15rem}
.flip .b{background:var(--teal);color:#07372f;transform:rotateY(180deg)}
.flip[aria-pressed=true] .f{transform:rotateY(-180deg)}
.flip[aria-pressed=true] .b{transform:rotateY(0)}
#sky{position:relative;height:330px;max-width:640px;margin:0 auto;border-radius:24px;background:linear-gradient(#3a1d6e,#1f1040);overflow:hidden}
.bal{position:absolute;bottom:-90px;width:58px;height:72px;border-radius:50% 50% 48% 48%;animation:rise linear infinite;padding:0}
.bal::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:34px;background:#ffffff66}
@keyframes rise{to{transform:translateY(-470px)}}
#wish{min-height:2.6em;margin-top:16px;font-size:1.2rem;color:var(--gold);font-weight:700}
textarea{width:100%;max-width:560px;min-height:150px;background:var(--card);color:var(--ink);border:2px solid #5a3a99;border-radius:20px;padding:18px;font:inherit;font-size:1.05rem;resize:vertical}
textarea:focus-visible{outline:3px solid var(--teal)}
footer{padding:30px 20px 60px;color:var(--mute);text-align:center}
@media (prefers-reduced-motion:reduce){.bal,.flame{animation:none}.bal{bottom:20px}}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<section>
  <h1 id="title" aria-label="Happy Birthday Samritha"></h1>
  <svg id="cake" viewBox="0 0 340 250" role="group" aria-label="Birthday cake with five candles">
    <ellipse cx="170" cy="236" rx="150" ry="10" fill="#0006"/>
    <rect x="30" y="150" width="280" height="80" rx="16" fill="#ff8fb8"/>
    <rect x="60" y="100" width="220" height="56" rx="14" fill="#ffd1e3"/>
    <path d="M60 118q18 22 36 0t36 0 36 0 36 0 36 0v-6H60z" fill="#fff4e6"/>
    <path d="M30 172q23 22 46 0t46 0 46 0 46 0 46 0 46 0v-8H30z" fill="#fff4e6"/>
    <g id="candles"></g>
  </svg>
  <div id="status" aria-live="polite">Tap each candle to light it.</div>
  <button class="cta" id="blow" hidden>Blow them out</button>
</section>

<section>
  <h2>Three gifts, just for you</h2>
  <p class="sub">Tap a box to open it.</p>
  <div class="row" id="gifts"></div>
</section>

<section>
  <h2>Why you’re my favourite</h2>
  <p class="sub">Tap a card to flip it.</p>
  <div class="row" id="flips"></div>
</section>

<section>
  <h2>Pop a balloon</h2>
  <p class="sub">Every one hides a wish.</p>
  <div id="sky"></div>
  <div id="wish" aria-live="polite"></div>
</section>

<section>
  <h2>A note from me</h2>
  <p class="sub">Edit the message, then send some love.</p>
  <textarea id="note" aria-label="Your birthday message">Dear Samritha,

Happy Birthday! You make every ordinary day feel like a celebration. Thank you for being exactly who you are. I hope this year is full of laughter, good food, and everything you wish for.

With all my love ♥</textarea>
  <div class="row" style="margin-top:22px">
    <button class="cta alt" id="hearts">Send hearts</button>
    <button class="cta" id="party">More confetti</button>
  </div>
</section>
<footer>Made with love for Samritha</footer>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var cv=$('#fx'),cx=cv.getContext('2d'),P=[],W,H;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
var cols=['#ffb627','#ff4f93','#2de2c5','#fff4e6','#8a6bff'];
function burst(x,y,n,heart){for(var i=0;i<n;i++){var a=Math.random()*6.283,s=3+Math.random()*9;
P.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,r:4+Math.random()*5,c:cols[i%5],life:120+Math.random()*60,rot:Math.random()*6,h:heart})}run()}
function rain(){for(var i=0;i<60;i++)P.push({x:Math.random()*W,y:-20-Math.random()*H*.6,vx:(Math.random()-.5)*1.5,vy:2+Math.random()*3,r:12+Math.random()*14,c:i%2?'#ff4f93':'#ff8fb8',life:400,rot:0,h:1,g:0});run()}
var going=false;
function run(){if(going)return;going=true;(function f(){cx.clearRect(0,0,W,H);
P=P.filter(function(p){return p.life>0&&p.y<H+40});
P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=(p.g===0?0:.28);p.vx*=.99;p.life--;p.rot+=.15;cx.fillStyle=p.c;
if(p.h){cx.font=p.r+'px sans-serif';cx.fillText('♥',p.x,p.y)}else{cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()}});
if(P.length)requestAnimationFrame(f);else{going=false;cx.clearRect(0,0,W,H)}})()}

/* title */
var t=$('#title');
function word(w,cls){var s=document.createElement('span');if(cls)s.className=cls;
w.split('').forEach(function(ch,i){var l=document.createElement('span');l.className='l';l.textContent=ch;
l.addEventListener('click',function(e){l.classList.add('hop');setTimeout(function(){l.classList.remove('hop')},300);burst(e.clientX,e.clientY,14)});s.appendChild(l)});return s}
t.appendChild(word('Happy Birthday,'));t.appendChild(word('Samritha!','name'));

/* candles */
var g=$('#candles'),lit=0,N=5,ns='http://www.w3.org/2000/svg';
for(var i=0;i<N;i++){var x=80+i*45,c=document.createElementNS(ns,'g');c.setAttribute('class','cndl');c.setAttribute('tabindex','0');c.setAttribute('role','button');c.setAttribute('aria-label','Light candle '+(i+1));
c.innerHTML='<rect x="'+(x-5)+'" y="58" width="10" height="46" rx="3" fill="'+cols[i%5]+'"/><rect x="'+(x-14)+'" y="30" width="28" height="74" fill="transparent"/><g class="flame"><path d="M'+x+' 28c-9 10-9 20 0 24 9-4 9-14 0-24z" fill="#ffb627"/><path d="M'+x+' 38c-4 5-4 9 0 11 4-2 4-6 0-11z" fill="#fff4e6"/></g>';
(function(c,x){function go(){if(c.classList.contains('on'))return;c.classList.add('on');lit++;burst(x/340*c.ownerSVGElement.getBoundingClientRect().width+c.ownerSVGElement.getBoundingClientRect().left,c.ownerSVGElement.getBoundingClientRect().top+30,10);
if(lit<N)$('#status').textContent=lit+' of '+N+' lit.';else{$('#status').textContent='All lit! Close your eyes and make a wish, Samritha.';$('#blow').hidden=false}}
c.addEventListener('click',go);c.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})})(c,x);
g.appendChild(c)}
$('#blow').addEventListener('click',function(){document.querySelectorAll('.cndl').forEach(function(c){c.classList.remove('on')});lit=0;this.hidden=true;
$('#status').textContent='Wish made! Happy Birthday! Tap the candles to light them again.';burst(innerWidth/2,innerHeight/2,160)});

/* gifts */
[['🎁','A year of big laughs and bigger hugs'],['💌','Someone is always thinking of you, and that someone is me'],['🌟','Every goal you chase this year, you will catch']].forEach(function(d){
var b=document.createElement('button');b.className='gift';b.setAttribute('aria-expanded','false');
b.innerHTML='<span class="ic">'+d[0]+'</span><span>Open me</span><span class="msg">'+d[1]+'</span>';
b.addEventListener('click',function(e){var o=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',!o);if(!o)burst(e.clientX,e.clientY,40)});$('#gifts').appendChild(b)});

/* flip cards */
[['Your smile','It lights up every room you walk into'],['Your kindness','You make people feel seen'],['Your laugh','Impossible not to join in'],['Your heart','The biggest one I know']].forEach(function(d){
var b=document.createElement('button');b.className='flip';b.setAttribute('aria-pressed','false');
b.innerHTML='<span class="f">'+d[0]+'</span><span class="b">'+d[1]+'</span>';
b.addEventListener('click',function(){b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true')});$('#flips').appendChild(b)});

/* balloons */
var wishes=['May all your dreams come true','Cake. So much cake.','Adventures are waiting for you','Health, joy and endless smiles','You deserve the whole world','Another year of being amazing','Your best year yet starts today','Love follows wherever you go'];
var bc=['#ff4f93','#ffb627','#2de2c5','#8a6bff','#ff7a59','#5ab0ff'];
for(var k=0;k<8;k++){(function(k){var b=document.createElement('button');b.className='bal';b.setAttribute('aria-label','Pop balloon '+(k+1));
b.style.left=(4+k*11.5)+'%';b.style.background=bc[k%6];b.style.animationDuration=(7+k%4*1.5)+'s';b.style.animationDelay=(-k*1.3)+'s';
b.addEventListener('click',function(e){burst(e.clientX,e.clientY,30);$('#wish').textContent=wishes[k];b.style.visibility='hidden';setTimeout(function(){b.style.visibility='visible'},4000)});
$('#sky').appendChild(b)})(k)}

/* finale */
$('#hearts').addEventListener('click',rain);
$('#party').addEventListener('click',function(){burst(innerWidth*.25,innerHeight*.6,100);burst(innerWidth*.75,innerHeight*.6,100)});
setTimeout(function(){burst(innerWidth/2,innerHeight*.3,120)},500);
})();
</script>
</body>
</html>
